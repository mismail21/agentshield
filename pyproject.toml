[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-shield"
version = "0.2.0"
description = "Prompt-injection attack suite, benchmark and defense layer for tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mohammad Ismail" }]
keywords = ["llm", "agents", "prompt-injection", "security", "benchmark", "guardrails"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
detector = ["torch>=2.2", "transformers>=4.40"]
anthropic = ["anthropic>=0.40"]
train = ["torch>=2.2", "transformers>=4.40", "datasets>=2.18", "accelerate>=0.30"]
dev = ["pytest>=8", "build"]
agentdojo = ["agentdojo==0.1.35"]

[project.urls]
Homepage = "https://github.com/mismail21/agentshield"

[project.scripts]
agentshield = "agentshield.cli:main"
agentshield-train = "agentshield.training:main"
agentshield-agentdojo = "agentshield.agentdojo_bench:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield"]

[tool.hatch.build.targets.sdist]
include = ["src/agentshield", "README.md", "LICENSE", "examples", "tests", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
